name: VMS
options:
  bundleIdPrefix: com.voicemoviestudio
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true
  developmentLanguage: ja

configs:
  Debug: debug
  Release: release

packages:
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle
    exactVersion: 2.9.6
  VMSCore:
    path: Packages/VMSCore

targets:
  VMS:
    type: application
    platform: macOS
    sources:
      - path: VMS
        excludes:
          - "Info 2.plist"
    dependencies:
      - package: Sparkle
      - package: VMSCore
    settings:
      base:
        PRODUCT_NAME: VoiceMovieStudio
        PRODUCT_BUNDLE_IDENTIFIER: com.voicemoviestudio.app
        MARKETING_VERSION: "1.2.5"
        CURRENT_PROJECT_VERSION: "1.2.5"
        CODE_SIGN_STYLE: Manual
        CODE_SIGN_IDENTITY: "-"
        UPDATE_FEED_URL: https://example.invalid/VoiceMovieStudio/appcast.xml
        SWIFT_VERSION: "6.0"
        OTHER_SWIFT_FLAGS: "$(inherited) -debug-prefix-map $(SRCROOT)=/Source -file-prefix-map $(SRCROOT)=/Source"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ENABLE_HARDENED_RUNTIME: NO
      configs:
        Release:
          ENABLE_HARDENED_RUNTIME: YES
    info:
      path: VMS/Info.plist
      properties:
        CFBundleDisplayName: ボイスムービースタジオ
        CFBundleName: ボイスムービースタジオ
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        SUFeedURL: "$(UPDATE_FEED_URL)"
        SUPublicEDKey: IlmKzCGhOuTb1aAQy9B/lbn130mvWyQ2j7gUzOkYX2k=
        SUEnableAutomaticChecks: true
        SUAutomaticallyUpdate: true
        SUScheduledCheckInterval: 86400
        LSApplicationCategoryType: public.app-category.video
        NSHumanReadableCopyright: "Copyright © 2026. All rights reserved."
        CFBundleDocumentTypes:
          - CFBundleTypeName: ボイスムービースタジオ プロジェクト
            CFBundleTypeRole: Editor
            LSHandlerRank: Owner
            LSItemContentTypes:
              - com.voicemoviestudio.project
        UTExportedTypeDeclarations:
          - UTTypeIdentifier: com.voicemoviestudio.project
            UTTypeDescription: ボイスムービースタジオ プロジェクト
            UTTypeConformsTo:
              - com.apple.package
            UTTypeTagSpecification:
              public.filename-extension:
                - VMS
        CFBundleLocalizations:
          - ja

schemes:
  VMS:
    build:
      targets:
        VMS: all
    run:
      config: Debug
    archive:
      config: Release
